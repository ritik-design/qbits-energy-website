    <line x1="0" y1="40" x2="0" y2="280" stroke="#ffffff" opacity="0.2" stroke-width="2"/>
    <path d="M0 280 L60 240 L120 180 L180 140 L240 100 L300 70 L360 50" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="140" r="14" fill="#fbbf24"/>
