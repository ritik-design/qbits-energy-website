<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inverter Overheating Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#F69133"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#fbbf24" opacity="0.15"/>
  <circle cx="180" cy="900" r="220" fill="#34d399" opacity="0.10"/>
  <g transform="translate(1230 540)" opacity="0.9">
    <rect x="40" y="80" width="40" height="220" rx="20" fill="#fbbf24"/>
    <circle cx="60" cy="320" r="40" fill="#dc2626" stroke="#fbbf24" stroke-width="6"/>
    <rect x="50" y="100" width="20" height="180" rx="10" fill="#dc2626"/>
    <text x="120" y="200" font-family="Inter,sans-serif" font-size="48" font-weight="800" fill="#fbbf24">75°C</text>
    <text x="120" y="270" font-family="Inter,sans-serif" font-size="24" fill="#ffffff" opacity="0.7">SHUTDOWN</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="270" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="135" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">MAINTENANCE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Inverter</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Overheating</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">18 Critical Questions Answered</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
</svg>
