  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#F69133" opacity="0.10"/>
  <circle cx="180" cy="900" r="220" fill="#34d399" opacity="0.10"/>
  <g transform="translate(1180 540)">
    <rect x="0" y="120" width="80" height="160" rx="6" fill="#34d399" opacity="0.7"/>
    <rect x="100" y="60" width="80" height="220" rx="6" fill="#34d399" opacity="0.85"/>
    <rect x="200" y="20" width="80" height="260" rx="6" fill="#fbbf24"/>
    <text x="40" y="320" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.7" text-anchor="middle">Cost</text>
    <text x="140" y="320" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.7" text-anchor="middle">Yield</text>
    <text x="240" y="320" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.7" text-anchor="middle">ROI</text>
  </g>
  <g transform="translate(110 360)">
