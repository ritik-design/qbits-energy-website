<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 420'>
  <rect width='800' height='420' fill='#ffffff'/>
  <text x='400' y='48' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='700' fill='#1e293b'>3 Pillars of PM Surya Ghar 2.0</text>
  <!-- Card 1 -->
  <rect x='40' y='90' width='220' height='280' rx='12' fill='#f8fafc' stroke='#e2e8f0' stroke-width='1'/>
  <rect x='40' y='90' width='220' height='6' rx='0' fill='#F69133'/>
  <circle cx='150' cy='170' r='42' fill='#049D65'/>
  <!-- Battery icon -->
  <rect x='132' y='150' width='32' height='44' rx='3' fill='none' stroke='#ffffff' stroke-width='3'/>
  <rect x='142' y='145' width='12' height='6' rx='1' fill='#ffffff'/>
  <rect x='138' y='172' width='20' height='16' rx='1' fill='#ffffff'/>
  <text x='150' y='250' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='700' fill='#1e293b'>Battery Storage</text>
  <text x='150' y='290' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#1e293b'>Storage now eligible for subsidy</text>
  <!-- Card 2 -->
  <rect x='290' y='90' width='220' height='280' rx='12' fill='#f8fafc' stroke='#e2e8f0' stroke-width='1'/>
  <rect x='290' y='90' width='220' height='6' rx='0' fill='#F69133'/>
  <circle cx='400' cy='170' r='42' fill='#049D65'/>
  <!-- Three houses connected by lines -->
  <line x1='368' y1='178' x2='400' y2='178' stroke='#ffffff' stroke-width='2'/>
  <line x1='400' y1='178' x2='432' y2='178' stroke='#ffffff' stroke-width='2'/>
  <!-- House 1 left -->
  <polygon points='368,162 358,172 378,172' fill='#ffffff'/>
  <rect x='360' y='172' width='16' height='14' fill='#ffffff'/>
  <!-- House 2 center -->
  <polygon points='400,156 388,168 412,168' fill='#ffffff'/>
  <rect x='390' y='168' width='20' height='16' fill='#ffffff'/>
  <!-- House 3 right -->
  <polygon points='432,162 422,172 442,172' fill='#ffffff'/>
  <rect x='424' y='172' width='16' height='14' fill='#ffffff'/>
  <text x='400' y='250' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='700' fill='#1e293b'>Shared Rooftop Solar</text>
  <text x='400' y='290' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#1e293b'>Renters and flat owners included</text>
  <!-- Card 3 -->
  <rect x='540' y='90' width='220' height='280' rx='12' fill='#f8fafc' stroke='#e2e8f0' stroke-width='1'/>
  <rect x='540' y='90' width='220' height='6' rx='0' fill='#F69133'/>
  <circle cx='650' cy='170' r='42' fill='#049D65'/>
  <!-- Upward bar chart icon -->
  <rect x='628' y='178' width='10' height='18' fill='#ffffff'/>
  <rect x='644' y='168' width='10' height='28' fill='#ffffff'/>
  <rect x='660' y='154' width='10' height='42' fill='#ffffff'/>
  <polyline points='628,176 644,164 670,150' fill='none' stroke='#ffffff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>
  <polygon points='670,150 662,152 668,158' fill='#ffffff'/>
  <text x='650' y='250' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#1e293b'>Generation-Linked Payout</text>
  <text x='650' y='290' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#1e293b'>Subsidy tied to actual output</text>
</svg>
