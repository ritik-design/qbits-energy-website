<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solar Inverter Failure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#F69133"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#fbbf24" opacity="0.15"/>
  <circle cx="180" cy="900" r="220" fill="#34d399" opacity="0.10"/>
  <g transform="translate(1200 580)" opacity="0.9">
    <polygon points="160,30 300,290 20,290" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round"/>
    <text x="160" y="200" font-family="Inter,sans-serif" font-size="120" font-weight="800" fill="#fbbf24" text-anchor="middle">!</text>
    <text x="160" y="340" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.7" font-weight="600" text-anchor="middle">20 QUESTIONS</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="270" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="135" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">MAINTENANCE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Solar Inverter</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Failure</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">20 Critical Questions Answered</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
</svg>
