<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IP66 Inverters India Climate Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#049D65"/></linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/></pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#34d399" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <g transform="translate(1200 600)" opacity="0.95">
    <path d="M160 20 L40 80 L40 180 Q40 260 160 320 Q280 260 280 180 L280 80 Z" fill="none" stroke="#34d399" stroke-width="8" stroke-linejoin="round"/>
    <text x="160" y="180" font-family="Inter,sans-serif" font-size="58" font-weight="800" fill="#34d399" text-anchor="middle">IP66</text>
    <text x="160" y="225" font-family="Inter,sans-serif" font-size="16" fill="#ffffff" opacity="0.7" text-anchor="middle" font-weight="600">DUST + JET</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="260" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="130" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">TECHNOLOGY</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="-2">IP66 Inverters</text>
  <text x="110" y="650" font-family="Inter,system-ui,sans-serif" font-size="60" font-weight="700" fill="#ffffff" opacity="0.85">India's Climate Survival Guide</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">Weather Protection for 25-Year Reliability</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
