<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-labelledby="title desc"><title id="title">Hybrid battery: power and communication are separate</title><desc id="desc">Battery power passes through specified protection and isolation to the inverter battery input. A separate BMS communication cable links the battery BMS and compatible inverter interface.</desc><rect width="720" height="550" rx="18" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#047857"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a"><text x="360" y="40" font-size="23" font-weight="bold">Battery: two separate connections</text><rect x="85" y="65" width="550" height="65" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="104" font-size="23">Battery power terminals</text><path d="M360 133v30" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="175" width="550" height="65" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="214" font-size="23">Specified DC protection and isolation</text><path d="M360 243v30" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="285" width="550" height="65" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="324" font-size="23">Inverter battery power input</text><rect x="85" y="395" width="550" height="80" rx="10" fill="#ecfdf5" stroke="#047857"/><text x="360" y="426" font-size="21">Separate link: battery BMS</text><text x="360" y="454" font-size="21">to compatible inverter communication port</text><text x="360" y="516" font-size="16" fill="#475569">Confirm voltage, polarity, protection, protocol and pinout in the manuals.</text></g></svg>