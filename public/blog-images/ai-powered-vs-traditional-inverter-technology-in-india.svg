  <circle cx="1380" cy="180" r="280" fill="#34d399" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <g transform="translate(1180 580)" opacity="0.95">
    <circle cx="160" cy="160" r="120" fill="none" stroke="#34d399" stroke-width="3" opacity="0.3"/>
    <circle cx="160" cy="160" r="80" fill="none" stroke="#34d399" stroke-width="3" opacity="0.5"/>
    <circle cx="160" cy="160" r="40" fill="#34d399"/>
    <text x="160" y="170" font-family="Inter,sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">AI</text>
    <circle cx="40" cy="40" r="6" fill="#fbbf24"/>
    <circle cx="280" cy="40" r="6" fill="#fbbf24"/>
    <circle cx="40" cy="280" r="6" fill="#fbbf24"/>
    <circle cx="280" cy="280" r="6" fill="#fbbf24"/>
    <line x1="40" y1="40" x2="160" y2="160" stroke="#34d399" opacity="0.4" stroke-width="2"/>
    <line x1="280" y1="40" x2="160" y2="160" stroke="#34d399" opacity="0.4" stroke-width="2"/>
    <line x1="40" y1="280" x2="160" y2="160" stroke="#34d399" opacity="0.4" stroke-width="2"/>
    <line x1="280" y1="280" x2="160" y2="160" stroke="#34d399" opacity="0.4" stroke-width="2"/>
  </g>
