<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qbits vs Sungrow vs Growatt: Inverter Brands Comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#049D65"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#F69133"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#F69133" opacity="0.10"/>
  <circle cx="180" cy="900" r="220" fill="#34d399" opacity="0.10"/>
  <g transform="translate(1130 600)">
    <rect x="0" y="0" width="140" height="280" rx="14" fill="#34d399" opacity="0.95"/>
    <rect x="160" y="60" width="140" height="220" rx="14" fill="#ffffff" opacity="0.18" stroke="#ffffff" stroke-opacity="0.3"/>
    <rect x="320" y="100" width="140" height="180" rx="14" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="70" y="160" font-family="Inter,sans-serif" font-size="28" fill="#0f172a" font-weight="800" text-anchor="middle">QBITS</text>
    <text x="230" y="190" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.8" font-weight="600" text-anchor="middle">Sungrow</text>
    <text x="390" y="210" font-family="Inter,sans-serif" font-size="22" fill="#ffffff" opacity="0.7" font-weight="600" text-anchor="middle">Growatt</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="290" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="145" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">BUYING GUIDE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Qbits vs Sungrow</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1.5">vs Growatt</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">Solar Inverter Brand Comparison 2026</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
