  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-1.5">On-Grid vs Hybrid</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Solar Inverters</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">ROI Guide for India 2026</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
