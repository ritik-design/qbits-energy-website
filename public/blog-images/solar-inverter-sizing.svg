<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solar Inverter Sizing Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#049D65"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#34d399" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <g transform="translate(1140 580)">
    <rect width="340" height="220" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="170" y="60" font-family="Inter,sans-serif" font-size="20" fill="#ffffff" opacity="0.6" font-weight="600" text-anchor="middle">DC:AC RATIO</text>
    <text x="170" y="140" font-family="Inter,sans-serif" font-size="68" font-weight="800" fill="#34d399" text-anchor="middle">1.2 : 1</text>
    <text x="170" y="180" font-family="Inter,sans-serif" font-size="20" fill="#ffffff" opacity="0.6" font-weight="500" text-anchor="middle">Optimal for India</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="180" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="90" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">GUIDE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="-2">Solar Inverter</text>
  <text x="110" y="650" font-family="Inter,system-ui,sans-serif" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="-2">Sizing</text>
  <text x="110" y="730" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">12 Critical Questions Answered</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
