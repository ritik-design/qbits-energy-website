<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630'>
  <rect width='1200' height='630' fill='#ffffff'/>
  <rect x='0' y='0' width='1200' height='8' fill='#049D65'/>
  <text x='600' y='52' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='36' font-weight='700' fill='#1e293b'>PM Surya Ghar 2.0</text>
  <text x='600' y='82' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='16' fill='#059669'>Current Scheme vs Proposed Upgrade</text>

  <!-- Left panel -->
  <rect x='40' y='110' width='480' height='480' rx='16' fill='#f8fafc' stroke='#e2e8f0' stroke-width='2'/>
  <rect x='40' y='110' width='480' height='56' rx='16' fill='#049D65'/>
  <rect x='40' y='150' width='480' height='16' fill='#049D65'/>
  <text x='280' y='148' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='22' font-weight='700' fill='#ffffff'>Current Scheme</text>

  <!-- Solar panel icon left -->
  <g transform='translate(100,200)'>
    <rect x='0' y='0' width='100' height='70' rx='4' fill='#059669' stroke='#1e293b' stroke-width='2'/>
    <line x1='25' y1='0' x2='25' y2='70' stroke='#ffffff' stroke-width='2'/>
    <line x1='50' y1='0' x2='50' y2='70' stroke='#ffffff' stroke-width='2'/>
    <line x1='75' y1='0' x2='75' y2='70' stroke='#ffffff' stroke-width='2'/>
    <line x1='0' y1='23' x2='100' y2='23' stroke='#ffffff' stroke-width='2'/>
    <line x1='0' y1='47' x2='100' y2='47' stroke='#ffffff' stroke-width='2'/>
    <polygon points='-8,70 108,70 100,82 0,82' fill='#1e293b'/>
    <text x='50' y='108' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='14' font-weight='600' fill='#1e293b'>Solar Panel</text>
  </g>

  <!-- Inverter icon left -->
  <g transform='translate(280,200)'>
    <rect x='10' y='5' width='80' height='65' rx='6' fill='#1e293b'/>
    <rect x='20' y='15' width='60' height='30' rx='3' fill='#049D65'/>
    <circle cx='35' cy='55' r='5' fill='#F69133'/>
    <circle cx='55' cy='55' r='5' fill='#F69133'/>
    <rect x='40' y='70' width='20' height='8' fill='#64748b'/>
    <text x='50' y='108' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='14' font-weight='600' fill='#1e293b'>Inverter</text>
  </g>

  <!-- One-time subsidy icon left -->
  <g transform='translate(190,360)'>
    <circle cx='50' cy='40' r='40' fill='#F69133'/>
    <text x='50' y='36' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='22' font-weight='700' fill='#ffffff'>₹</text>
    <text x='50' y='56' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='700' fill='#ffffff'>1x</text>
    <text x='50' y='108' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='14' font-weight='600' fill='#1e293b'>One-time Subsidy</text>
  </g>

  <!-- Center divider arrow -->
  <g transform='translate(560,280)'>
    <rect x='0' y='30' width='80' height='40' rx='6' fill='#F69133'/>
    <polygon points='80,15 120,50 80,85' fill='#F69133'/>
    <text x='48' y='55' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='11' font-weight='700' fill='#ffffff'>PROPOSED</text>
  </g>

  <!-- Right panel -->
  <rect x='680' y='110' width='480' height='480' rx='16' fill='#f0fdf4' stroke='#049D65' stroke-width='2'/>
  <rect x='680' y='110' width='480' height='56' rx='16' fill='#059669'/>
  <rect x='680' y='150' width='480' height='16' fill='#059669'/>
  <text x='920' y='148' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='22' font-weight='700' fill='#ffffff'>Proposed 2.0</text>

  <!-- Solar panel icon right -->
  <g transform='translate(720,190)'>
    <rect x='0' y='0' width='70' height='48' rx='3' fill='#059669' stroke='#1e293b' stroke-width='1.5'/>
    <line x1='17.5' y1='0' x2='17.5' y2='48' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='35' y1='0' x2='35' y2='48' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='52.5' y1='0' x2='52.5' y2='48' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='0' y1='16' x2='70' y2='16' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='0' y1='32' x2='70' y2='32' stroke='#ffffff' stroke-width='1.5'/>
    <polygon points='-5,48 75,48 70,56 0,56' fill='#1e293b'/>
    <text x='35' y='76' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='600' fill='#1e293b'>Solar Panel</text>
  </g>

  <!-- Inverter icon right -->
  <g transform='translate(830,190)'>
    <rect x='8' y='2' width='54' height='46' rx='4' fill='#1e293b'/>
    <rect x='14' y='8' width='42' height='22' rx='2' fill='#049D65'/>
    <circle cx='24' cy='38' r='3.5' fill='#F69133'/>
    <circle cx='38' cy='38' r='3.5' fill='#F69133'/>
    <rect x='27' y='48' width='16' height='6' fill='#64748b'/>
    <text x='35' y='76' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='600' fill='#1e293b'>Inverter</text>
  </g>

  <!-- Battery icon right -->
  <g transform='translate(940,190)'>
    <rect x='12' y='8' width='50' height='40' rx='4' fill='#049D65' stroke='#1e293b' stroke-width='1.5'/>
    <rect x='28' y='2' width='18' height='8' rx='2' fill='#1e293b'/>
    <rect x='18' y='16' width='10' height='24' rx='1' fill='#ffffff'/>
    <rect x='32' y='22' width='10' height='18' rx='1' fill='#ffffff'/>
    <rect x='46' y='28' width='10' height='12' rx='1' fill='#ffffff'/>
    <text x='37' y='76' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='600' fill='#1e293b'>Battery</text>
  </g>

  <!-- Shared rooftop houses -->
  <g transform='translate(760,320)'>
    <!-- House 1 -->
    <rect x='0' y='30' width='50' height='40' fill='#ffffff' stroke='#059669' stroke-width='2'/>
    <polygon points='-5,30 25,5 55,30' fill='#F69133'/>
    <rect x='18' y='45' width='14' height='25' fill='#1e293b'/>
    <!-- House 2 -->
    <rect x='55' y='35' width='50' height='35' fill='#ffffff' stroke='#059669' stroke-width='2'/>
    <polygon points='50,35 80,10 110,35' fill='#049D65'/>
    <rect x='73' y='48' width='14' height='22' fill='#1e293b'/>
    <!-- House 3 -->
    <rect x='110' y='28' width='50' height='42' fill='#ffffff' stroke='#059669' stroke-width='2'/>
    <polygon points='105,28 135,4 165,28' fill='#F69133'/>
    <rect x='128' y='45' width='14' height='25' fill='#1e293b'/>
    <!-- Shared link lines -->
    <line x1='25' y1='5' x2='80' y2='10' stroke='#F69133' stroke-width='2'/>
    <line x1='80' y1='10' x2='135' y2='4' stroke='#F69133' stroke-width='2'/>
    <circle cx='25' cy='5' r='4' fill='#F69133'/>
    <circle cx='80' cy='10' r='4' fill='#F69133'/>
    <circle cx='135' cy='4' r='4' fill='#F69133'/>
    <text x='80' y='95' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='600' fill='#1e293b'>Shared Rooftop</text>
  </g>

  <!-- Generation-linked chart -->
  <g transform='translate(980,320)'>
    <rect x='0' y='0' width='120' height='80' rx='6' fill='#ffffff' stroke='#e2e8f0' stroke-width='1.5'/>
    <!-- axes -->
    <line x1='15' y1='65' x2='110' y2='65' stroke='#94a3b8' stroke-width='1.5'/>
    <line x1='15' y1='10' x2='15' y2='65' stroke='#94a3b8' stroke-width='1.5'/>
    <!-- bars / line chart -->
    <polyline points='20,55 40,45 60,35 80,28 100,15' fill='none' stroke='#049D65' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/>
    <circle cx='20' cy='55' r='3.5' fill='#F69133'/>
    <circle cx='40' cy='45' r='3.5' fill='#F69133'/>
    <circle cx='60' cy='35' r='3.5' fill='#F69133'/>
    <circle cx='80' cy='28' r='3.5' fill='#F69133'/>
    <circle cx='100' cy='15' r='3.5' fill='#F69133'/>
    <text x='60' y='100' text-anchor='middle' font-family='system-ui,Segoe UI,Arial,sans-serif' font-size='12' font-weight='600' fill='#1e293b'>Gen-Linked Benefit</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x='0' y='622' width='1200' height='8' fill='#F69133'/>
</svg>
