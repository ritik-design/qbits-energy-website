<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How to Read Solar Inverter Datasheets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#049D65"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#ffffff" opacity="0.05"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <rect x="1200" y="600" width="320" height="220" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
  <line x1="1240" y1="660" x2="1480" y2="660" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <line x1="1240" y1="700" x2="1440" y2="700" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <line x1="1240" y1="740" x2="1460" y2="740" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <line x1="1240" y1="780" x2="1400" y2="780" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <g transform="translate(110 360)">
    <rect width="220" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="110" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">GUIDE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1.5">How to Read Solar</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Inverter Datasheets</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">11 Critical Specs for EPCs</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
