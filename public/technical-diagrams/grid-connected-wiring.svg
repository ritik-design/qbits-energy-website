<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Grid-connected solar: connection blocks</title><desc id="desc">PV strings: series modules to DC isolation and protection, as specified to Grid-connected inverter to AC isolation, protection and any generation meter to Consumer board and site loads to Bidirectional service meter and utility grid. Earthing and bonding are separate design requirements; this is not a terminal wiring guide.</desc><rect width="720" height="760" rx="18" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#047857"/></marker></defs><text x="360" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Grid-connected solar: connection blocks</text><rect x="85" y="70" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">PV strings: series modules</text><path d="M360 135v32" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="175" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">DC isolation and protection, as specified</text><path d="M360 240v32" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="280" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Grid-connected inverter</text><path d="M360 345v32" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="385" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">AC isolation, protection and any generation meter</text><path d="M360 450v32" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="490" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Consumer board and site loads</text><path d="M360 555v32" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="595" width="550" height="64" rx="10" fill="white" stroke="#94a3b8"/><text x="360" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Bidirectional service meter and utility grid</text><text x="360" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Conceptual blocks only. Follow exact equipment and utility documents.</text></svg>