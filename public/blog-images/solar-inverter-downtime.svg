    <line x1="160" y1="80" x2="160" y2="160" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <line x1="160" y1="160" x2="220" y2="200" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
