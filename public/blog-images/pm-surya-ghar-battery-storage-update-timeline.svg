<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400'>
  <rect width='900' height='400' fill='#0f172a'/>
  <text x='450' y='48' text-anchor='middle' fill='#ffffff' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='bold'>How Long Policy Proposals Take</text>
  <line x1='120' y1='180' x2='780' y2='180' stroke='#334155' stroke-width='4'/>
  <circle cx='120' cy='180' r='28' fill='none' stroke='#F69133' stroke-width='6'/>
  <circle cx='120' cy='180' r='22' fill='#049D65'/>
  <text x='120' y='187' text-anchor='middle' fill='#ffffff' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold'>1</text>
  <text x='120' y='240' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold'>Media Reports</text>
  <text x='120' y='262' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='13'>0 months</text>
  <circle cx='340' cy='180' r='22' fill='#049D65'/>
  <text x='340' y='187' text-anchor='middle' fill='#ffffff' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold'>2</text>
  <text x='340' y='240' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold'>Draft Framework</text>
  <text x='340' y='262' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='13'>3-6 months</text>
  <circle cx='560' cy='180' r='22' fill='#049D65'/>
  <text x='560' y='187' text-anchor='middle' fill='#ffffff' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold'>3</text>
  <text x='560' y='240' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold'>Cabinet Approval</text>
  <text x='560' y='262' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='13'>8-14 months</text>
  <circle cx='780' cy='180' r='22' fill='#049D65'/>
  <text x='780' y='187' text-anchor='middle' fill='#ffffff' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold'>4</text>
  <text x='780' y='240' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold'>MNRE Notification</text>
  <text x='780' y='262' text-anchor='middle' fill='#cbd5e1' font-family='Arial, Helvetica, sans-serif' font-size='13'>12-24 months</text>
  <text x='450' y='360' text-anchor='middle' fill='#94a3b8' font-family='Arial, Helvetica, sans-serif' font-size='13'>Based on the original PM Surya Ghar rollout timeline, 2023 to 2024</text>
</svg>
