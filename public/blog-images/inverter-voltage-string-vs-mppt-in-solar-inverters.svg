<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inverter String vs MPPT Voltage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#049D65"/></linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/></pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#34d399" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <g transform="translate(1140 580)" opacity="0.95">
    <line x1="0" y1="200" x2="380" y2="200" stroke="#ffffff" opacity="0.2" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="200" stroke="#ffffff" opacity="0.2" stroke-width="2"/>
    <rect x="40" y="80" width="300" height="80" fill="#34d399" opacity="0.3"/>
    <text x="190" y="125" font-family="Inter,sans-serif" font-size="22" fill="#34d399" font-weight="700" text-anchor="middle">MPPT WINDOW</text>
    <line x1="40" y1="40" x2="40" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="340" y1="40" x2="340" y2="200" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="40" y="30" font-family="Inter,sans-serif" font-size="16" fill="#fbbf24" font-weight="700" text-anchor="middle">200V</text>
    <text x="340" y="30" font-family="Inter,sans-serif" font-size="16" fill="#fbbf24" font-weight="700" text-anchor="middle">1000V</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="260" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="130" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">TECHNOLOGY</text>
