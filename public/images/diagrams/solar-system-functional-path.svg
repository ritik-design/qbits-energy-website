<svg xmlns="http://www.w3.org/2000/svg" width="640" height="721" viewBox="0 0 640 721" role="img" aria-labelledby="title desc"><title id="title">On-grid solar: functional connections</title><desc id="desc">Conceptual functional diagram. Not a terminal wiring or installation drawing.</desc><rect width="640" height="721" rx="20" fill="#f1f5f9"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="320" y="40" font-size="22" fill="#0f172a">On-grid solar: functional connections</text><text x="320" y="68" font-size="16" fill="#475569">Conceptual only. Follow the exact equipment manuals.</text><rect x="55" y="92" width="530" height="70" rx="10" fill="#fff" stroke="#047857" stroke-width="2"/><text x="320" y="121" font-size="20" fill="#0f172a">PV strings</text><text x="320" y="145" font-size="16" fill="#475569">Keep independent MPPT paths distinct in the design</text><path d="M320 164v28m-7-8 7 8 7-8" stroke="#047857" stroke-width="3" fill="none"/><rect x="55" y="197" width="530" height="70" rx="10" fill="#fff" stroke="#047857" stroke-width="2"/><text x="320" y="226" font-size="20" fill="#0f172a">DC input protection and isolation</text><text x="320" y="250" font-size="16" fill="#475569">Arrangement and ratings are project-specific</text><path d="M320 269v28m-7-8 7 8 7-8" stroke="#047857" stroke-width="3" fill="none"/><rect x="55" y="302" width="530" height="70" rx="10" fill="#fff" stroke="#047857" stroke-width="2"/><text x="320" y="331" font-size="20" fill="#0f172a">Grid-connected inverter</text><text x="320" y="355" font-size="16" fill="#475569">DC conversion; no ordinary outage backup</text><path d="M320 374v28m-7-8 7 8 7-8" stroke="#047857" stroke-width="3" fill="none"/><rect x="55" y="407" width="530" height="70" rx="10" fill="#fff" stroke="#047857" stroke-width="2"/><text x="320" y="436" font-size="20" fill="#0f172a">AC protection and distribution</text><text x="320" y="460" font-size="16" fill="#475569">Feeds connected loads; export depends on approval</text><path d="M320 479v28m-7-8 7 8 7-8" stroke="#047857" stroke-width="3" fill="none"/><rect x="55" y="512" width="530" height="70" rx="10" fill="#fff" stroke="#047857" stroke-width="2"/><text x="320" y="541" font-size="20" fill="#0f172a">Approved metering and utility connection</text><text x="320" y="565" font-size="16" fill="#475569">Import/export measurement follows utility rules</text><text x="320" y="630" font-size="15" fill="#475569">Protective bonding is a separate engineered network.</text><text x="320" y="658" font-size="15" fill="#475569">Neutral, earth, conductors and device ratings are not shown.</text></g></svg>