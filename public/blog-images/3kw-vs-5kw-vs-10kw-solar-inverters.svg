<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3kW vs 5kW vs 10kW Inverters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="55%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#049D65"/></linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/></pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#F69133"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#fbbf24" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#34d399" opacity="0.12"/>
  <g transform="translate(1140 580)" opacity="0.95">
    <rect width="100" height="100" y="180" rx="8" fill="#34d399" opacity="0.5"/>
    <text x="50" y="240" font-family="Inter,sans-serif" font-size="24" fill="#ffffff" font-weight="800" text-anchor="middle">3 kW</text>
    <rect x="120" y="100" width="100" height="180" rx="8" fill="#34d399" opacity="0.85"/>
    <text x="170" y="200" font-family="Inter,sans-serif" font-size="24" fill="#0f172a" font-weight="800" text-anchor="middle">5 kW</text>
    <rect x="240" y="20" width="100" height="260" rx="8" fill="#fbbf24"/>
    <text x="290" y="160" font-family="Inter,sans-serif" font-size="24" fill="#0f172a" font-weight="800" text-anchor="middle">10 kW</text>
  </g>
  <g transform="translate(110 360)">
    <rect width="290" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="145" y="36" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">BUYING GUIDE</text>
  </g>
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">3 vs 5 vs 10 kW</text>
  <text x="110" y="640" font-family="Inter,system-ui,sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Solar Inverters</text>
  <text x="110" y="720" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="500" fill="url(#accent)">Capacity Guide 2026</text>
  <text x="110" y="900" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#34d399" letter-spacing="6">QBITS ENERGY</text>
</svg>
