<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solar EPC India Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#049D65"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.4" fill="#ffffff" opacity="0.15"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1380" cy="180" r="280" fill="#34d399" opacity="0.12"/>
  <circle cx="180" cy="900" r="220" fill="#F69133" opacity="0.10"/>
  <g transform="translate(1140 540)" opacity="0.95">
    <rect x="0" y="100" width="80" height="200" rx="6" fill="#34d399" opacity="0.6"/>
    <rect x="100" y="60" width="80" height="240" rx="6" fill="#34d399" opacity="0.75"/>
    <rect x="200" y="20" width="80" height="280" rx="6" fill="#34d399"/>
    <rect x="300" y="60" width="80" height="240" rx="6" fill="#fbbf24" opacity="0.9"/>
